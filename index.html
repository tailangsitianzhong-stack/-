<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ゲームセレクト</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#232d2b;--fg:#e9e4d0;--pn:#33403d;--ac:#e0a43a;--sh:#0006;box-sizing:border-box}
@media (prefers-color-scheme:light){:root{--bg:#e6e2cd;--fg:#232d2b;--pn:#cfcab0;--sh:#0003}}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--fg);font-family:'DotGothic16','Hiragino Kaku Gothic ProN',Meiryo,sans-serif}
body{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#menu{position:fixed;inset:0;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 20px);overflow-y:auto}
#menu>*{flex-shrink:0}
h1{margin:0;font-size:26px;font-weight:400;letter-spacing:.12em;text-align:center}
.sub{font-size:14px;opacity:.75;text-align:center;margin-top:-8px}
.cards{display:flex;flex-direction:column;gap:16px;width:min(100%,420px)}
@media (orientation:landscape) and (min-width:720px){.cards{flex-direction:row;width:min(100%,1000px)}}
.card{all:unset;box-sizing:border-box;flex:1;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 14px 16px;background:var(--pn);border:4px solid var(--fg);box-shadow:6px 6px 0 var(--sh);text-align:center;transition:transform .08s,box-shadow .08s}
.card:hover,.card:focus-visible{border-color:var(--ac)}
.card:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--sh)}
.card svg{width:96px;height:72px;image-rendering:pixelated}
.card b{font-weight:400;font-size:22px}
.card small{font-size:13px;opacity:.8;line-height:1.5}
.card i{font-style:normal;font-size:15px;color:var(--bg);background:var(--ac);padding:3px 14px;margin-top:2px}
#stage{position:fixed;inset:0;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) calc(env(safe-area-inset-bottom,0px) + 40px) env(safe-area-inset-left,0px);background:var(--bg)}
#stage[hidden],#menu[hidden],#ask[hidden]{display:none}
#fr{width:100%;height:100%;border:0;display:block;background:var(--bg)}
#back{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 6px);font:inherit;font-size:14px;color:var(--fg);background:var(--pn);border:2px solid var(--fg);padding:5px 10px;cursor:pointer;opacity:.85;line-height:1}
#back:active{opacity:1}
#ask{position:fixed;inset:0;z-index:9;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px}
#ask div{background:var(--pn);border:4px solid var(--fg);padding:18px;max-width:320px;text-align:center;line-height:1.6}
#ask p{margin:0 0 14px;font-size:16px}
#ask button{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:3px solid var(--fg);padding:8px 18px;margin:0 6px;cursor:pointer}
#ask button.y{background:var(--ac);color:var(--bg);border-color:var(--ac)}
</style></head><body>

</div>
